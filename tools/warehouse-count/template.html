<title>Warehouse Count</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar, rack index on the left, every rack side stacked in one scrolling column,
   and a fixed entry bar at the bottom (like a spreadsheet's formula bar). Racks drawn with steel
   uprights between columns and orange beams under each level, matching the Rack 6 map. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #5a6877;
  --line: #d3dae2;
  --slot: #f7f9fb;
  --upright: #37597f;
  --beam: #dd6b1f;
  --sel: #1d63c9;
  --sel-soft: #dce8fa;
  --done: #e6f2ec;
  --done-ink: #13704b;
  --warn: #a15c00;
  --warn-soft: #fdf0d8;
  --bad: #b42318;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --cw: 62px;
  --ch: 40px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #171e26; --ink: #e4e9ee; --muted: #93a1af; --line: #2a3541; --slot: #1c252f;
    --upright: #6f95c0; --beam: #de7a35; --sel: #5d9bf0; --sel-soft: #1b3150; --done: #16301f; --done-ink: #5fd39b;
    --warn: #f0b456; --warn-soft: #3a2b12; --bad: #f07a6c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #171e26; --ink: #e4e9ee; --muted: #93a1af; --line: #2a3541; --slot: #1c252f;
  --upright: #6f95c0; --beam: #de7a35; --sel: #5d9bf0; --sel-soft: #1b3150; --done: #16301f; --done-ink: #5fd39b;
  --warn: #f0b456; --warn-soft: #3a2b12; --bad: #f07a6c; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.4; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
.top h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.top h1 span { color: var(--beam); }
.grp { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.grp label { font-size: 12px; color: var(--muted); }
select, .top input[type="text"] { border: 1px solid var(--line); background: var(--slot); border-radius: 4px; padding: 5px 8px; font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--slot); border-radius: 4px; padding: 5px 10px; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--sel); border-color: var(--sel); color: #fff; }
:root:not([data-theme="light"]) .btn.primary { color: var(--surface); }
.progress { display: grid; gap: 3px; min-width: 200px; }
.progress .txt { font-size: 12px; color: var(--muted); }
.progress .txt b { color: var(--ink); font-family: var(--f-mono); font-weight: 600; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--done-ink); width: 0; }
.status { font-size: 12px; color: var(--muted); }
.status.warn { color: var(--warn); }
.spacer { flex: 1; }

/* Body layout */
.layout { display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 16px; padding-inline: 16px; padding-block: 14px 190px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
nav.index { position: sticky; top: 70px; max-height: calc(100vh - 280px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
@media (max-width: 860px) { nav.index { position: static; max-height: none; display: flex; overflow-x: auto; gap: 4px; } }
nav.index button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; width: 100%; border: 0; background: transparent; text-align: left; padding: 5px 8px; border-radius: 4px; white-space: nowrap; }
nav.index button:hover { background: var(--slot); }
nav.index button.here { background: var(--sel-soft); }
nav.index .n { font-weight: 600; }
nav.index .p { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
nav.index .p.full { color: var(--done-ink); }

main { display: grid; gap: 14px; min-width: 0; }
.face { scroll-margin-top: 80px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 12px; min-width: 0; }
.face h2 { margin: 0 0 6px; font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .03em; display: flex; gap: 10px; align-items: baseline; }
.face h2 small { font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.scroller { overflow-x: auto; padding-bottom: 4px; }
.rack { display: grid; gap: 3px 3px; width: max-content; align-items: stretch; }
.lbl { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; }
.colnum { font-family: var(--f-mono); font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; }
.upr { background: var(--upright); border-radius: 1px; }
.void { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--line) 6px 7px); border-radius: 3px; min-height: var(--ch); }
.floor { display: flex; align-items: stretch; gap: 3px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); width: max-content; }
.floor .lbl { width: 40px; justify-content: flex-start; font-family: var(--f-display); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink); }
.area-row { display: flex; align-items: stretch; gap: 3px; width: max-content; }
.area-row + .area-row { margin-top: 6px; }
.area-row .lbl { width: 150px; justify-content: flex-start; font-family: var(--f-body); font-size: 13px; color: var(--ink); }

.cell { width: var(--cw); min-height: var(--ch); border: 1px dashed var(--line); border-bottom: 3px solid var(--beam); border-radius: 3px 3px 0 0;
  background: transparent; padding: 2px 4px; text-align: left; display: grid; align-content: start; font-family: var(--f-mono); line-height: 1.2; position: relative; }
.floor .cell, .area-row .cell { border-bottom: 1px dashed var(--line); border-radius: 3px; }
.cell .c { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .c small { font-weight: 400; color: var(--muted); font-size: 10px; }
.cell .q { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cell .w { font-size: 10px; font-style: italic; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
.cell { scroll-margin: 90px 70px 210px 70px; }
.cell.done { background: var(--done); border-style: solid; border-color: var(--line); border-bottom-color: var(--beam); }
.floor .cell.done, .area-row .cell.done { border-bottom-color: var(--line); }
.cell.done .q { color: var(--done-ink); font-weight: 600; }
.cell.empty { border-style: solid; background: var(--slot); }
.cell.empty .c { color: var(--muted); font-weight: 400; }
.cell.diff::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.cell.insel { box-shadow: inset 0 0 0 2px var(--sel); }
.cell.sel { outline: 2px solid var(--sel); outline-offset: 1px; z-index: 1; }
.cell.editing { background: var(--sel-soft); }
.grid-focus:focus { outline: none; }

/* Entry bar */
.entry { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 2px solid var(--upright);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; box-shadow: 0 -4px 14px rgb(0 0 0 / .08); }
.erow { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.eloc { font-family: var(--f-mono); font-weight: 600; font-size: 20px; min-width: 150px; }
.eloc small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: var(--slot); border-radius: 14px; padding: 2px 4px 2px 10px; font-size: 13px; }
.chip b { font-family: var(--f-mono); }
.chip button { border: 0; background: transparent; color: var(--muted); padding: 0 6px; font-size: 15px; line-height: 1; }
.fields { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: relative; flex: 1; min-width: 280px; }
.fields input { border: 1px solid var(--line); background: var(--slot); border-radius: 4px; padding: 8px 10px; font-size: 15px; }
#prod { flex: 1; min-width: 200px; }
#qty { width: 92px; font-family: var(--f-mono); }
.fields input:focus { border-color: var(--sel); background: var(--surface); }
.picked { font-size: 13px; color: var(--muted); max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.picked b { color: var(--ink); font-family: var(--f-mono); }
.sugg { position: absolute; left: 0; bottom: calc(100% + 6px); width: min(620px, 100%); max-height: 330px; overflow-y: auto; list-style: none; margin: 0; padding: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgb(0 0 0 / .16); }
.sugg li { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
.sugg li.hl { background: var(--sel-soft); }
.sugg .sc { font-family: var(--f-mono); font-weight: 600; }
.sugg .sn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sugg .sn small { color: var(--muted); }
.sugg .sp { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.sugg .head { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 4px 8px; cursor: default; }
.sugg .none { display: block; color: var(--muted); cursor: default; }
.flag { color: var(--bad); font-family: var(--f-body); font-size: 11px; font-weight: 600; }
.hint { font-size: 12px; color: var(--muted); }
.hint kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--slot); color: var(--ink); }
.was { font-size: 12px; color: var(--muted); }
.was b { color: var(--ink); font-family: var(--f-mono); }
.toast { position: fixed; left: 50%; bottom: 180px; transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 5px; font-size: 13px; max-width: calc(100% - 32px); }
.help { position: fixed; right: 16px; bottom: 150px; z-index: 35; width: min(440px, calc(100% - 32px)); max-height: calc(100vh - 240px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 10px 30px rgb(0 0 0 / .2); padding: 12px 14px; }
.help h3 { margin: 0 0 8px; font-family: var(--f-display); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: .03em; display: flex; justify-content: space-between; align-items: center; }
.help h4 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.help dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; margin: 0; font-size: 13px; }
.help dt { white-space: nowrap; }
.help dd { margin: 0; color: var(--ink); }
.help kbd { font-family: var(--f-mono); font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; background: var(--slot); }
.newcount { display: flex; gap: 6px; align-items: center; }
@media (prefers-reduced-motion: no-preference) { .cell { transition: background .12s; } }
</style>

<div class="top">
  <h1>Warehouse <span>/</span> Count</h1>
  <div class="grp">
    <label for="session">Count</label>
    <select id="session"></select>
    <button class="btn" id="newBtn">New count</button>
    <span class="newcount" id="newForm" hidden>
      <input type="text" id="newName" placeholder="Name, e.g. October count" aria-label="New count name">
      <button class="btn primary" id="newCreate">Create</button>
      <button class="btn" id="newCancel">Cancel</button>
    </span>
  </div>
  <div class="progress" aria-live="polite">
    <span class="txt" id="progTxt"></span>
    <span class="bar"><i id="progBar"></i></span>
  </div>
  <div class="spacer"></div>
  <div class="grp">
    <label><input type="checkbox" id="showPrev"> Show last sheet count</label>
    <label for="after">After saving</label>
    <select id="after">
      <option value="right">move right</option>
      <option value="down">move down</option>
      <option value="up">move up</option>
      <option value="stay">stay</option>
    </select>
    <button class="btn" id="helpBtn" aria-expanded="false" aria-controls="help">Shortcuts</button>
    <button class="btn primary" id="expXlsx">Export Excel</button>
  </div>
  <span class="status" id="saveStatus">Connecting…</span>
</div>

<div class="layout">
  <nav class="index" id="index" aria-label="Racks"></nav>
  <main id="grid" class="grid-focus" tabindex="0" aria-label="Rack slots. Use arrow keys to move, type to enter a product."></main>
</div>

<div class="entry" id="entry">
  <div class="erow">
    <div class="eloc" id="eloc">6A-01-L1-B1<small>Rack 6, side A</small></div>
    <div class="chips" id="chips"></div>
    <div class="fields">
      <ul class="sugg" id="sugg" hidden role="listbox" aria-label="Matching products"></ul>
      <input id="prod" type="text" autocomplete="off" spellcheck="false" placeholder="Product code or name" aria-label="Product" aria-controls="sugg">
      <span class="picked" id="picked"></span>
      <input id="qty" type="text" inputmode="numeric" autocomplete="off" placeholder="Cases" aria-label="Cases">
    </div>
  </div>
  <div class="erow">
    <span class="was" id="was"></span>
    <span class="spacer"></span>
    <span class="hint" id="hint"></span>
  </div>
</div>
<div class="help" id="help" hidden role="dialog" aria-label="Keyboard shortcuts"></div>
<div class="toast" id="toast" hidden></div>

<script>
const DATA = /*DATA*/;
const $ = id => document.getElementById(id);
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || "");
const MOD = IS_MAC ? "⌘" : "Ctrl", ALT = IS_MAC ? "Option" : "Alt";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const P = new Map(DATA.products.map(p => [p.k, p]));
for (const p of DATA.products) p.hay = (p.c + " " + p.n + " " + p.k + " " + p.cat + " " + p.b).toLowerCase();
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };

/* ---------- Layout model ---------- */
const FACES = DATA.faces.map(f => {
  const cols = f.cols.map(([c, slots]) => ({ c, slots, width: Math.max(...slots.map(s => s[1])) }));
  let x = 0; for (const col of cols) { col.x0 = x; x += col.width; }
  const rack = f.id.startsWith("D") ? "D" + f.id.slice(1, -1) : f.id.slice(0, -1);
  return { id: f.id, rack, side: f.id.slice(-1), cols, width: x };
});
const rackName = r => r.startsWith("D") ? "Door " + r.slice(1) : "Rack " + r;
const RACKS = [...new Set(FACES.map(f => f.rack))];
const AREAS = DATA.areas.map(([id, name]) => ({ id, name }));
const SLOT_META = new Map(); // code -> {face, col, level, bay} for rack slots
for (const f of FACES) for (const col of f.cols) for (const [l, b] of col.slots) {
  const code = `${f.id}-${String(col.c).padStart(2, "0")}-L${l}-B${b}`;
  SLOT_META.set(code, { face: f.id, rack: f.rack, col: col.c, level: l, bay: b, x: col.x0 + b - 1 });
}
const TOTAL_SLOTS = SLOT_META.size;
const groupOf = code => {
  const m = SLOT_META.get(code); if (m) return "r-" + m.rack;
  const f = code.match(/^(D?\d+)[A-Z]-FLOOR-P\d+$/); if (f) return "r-" + f[1];
  return "areas";
};
const describe = code => {
  const m = SLOT_META.get(code);
  if (m) return `${rackName(m.rack)}, side ${m.face.slice(-1)} · column ${m.col} · level ${m.level}${m.level === 1 ? " (bottom)" : ""} · bay ${m.bay}`;
  const f = code.match(/^((D?\d+)([A-Z]))-FLOOR-P(\d+)$/);
  if (f) return `${rackName(f[2])}, side ${f[3]} floor · pallet ${+f[4]}`;
  const a = AREAS.find(a => code.startsWith(a.id + "-P"));
  return a ? `${a.name} · pallet ${+code.slice(a.id.length + 2)}` : code;
};

/* ---------- State ---------- */
const cells = new Map();          // code -> {lines:[{k,q}], empty:bool}
const st = {
  sel: FACES[0] ? `${FACES[0].id}-01-L4-B1` : null,
  anchor: null,                   // other corner of a Shift selection
  mode: "grid",                   // grid | product | qty
  draft: null,                    // {code, lines:[], item:null}
  matches: [], hl: 0,
  showPrev: LS.get("ic.showPrev", false),
  after: LS.get("ic.after", "right"),
  lastLines: null,
  recent: LS.get("ic.recent", []),
};
if (!SLOT_META.has(st.sel)) st.sel = SLOT_META.keys().next().value;
const undo = [];

/* ---------- Floors: how many pallet spots each floor row shows ---------- */
const floorBases = () => [...FACES.map(f => f.id + "-FLOOR"), ...AREAS.map(a => a.id)];
function floorCount(base) {
  let hi = 0;
  for (const code of cells.keys()) if (code.startsWith(base + "-P")) hi = Math.max(hi, +code.slice(base.length + 2));
  if (st.showPrev) for (const code in DATA.prev) if (code.startsWith(base + "-P")) hi = Math.max(hi, +code.slice(base.length + 2));
  return Math.max(3, hi + 1);
}
const fcode = (base, n) => `${base}-P${String(n).padStart(2, "0")}`;

/* ---------- Navigation rows (visual order, top to bottom) ---------- */
let ROWS = [], ROW_OF = new Map();
function buildRows() {
  ROWS = []; ROW_OF = new Map();
  const push = (id, list, group) => { const i = ROWS.length; ROWS.push({ id, group, cells: list }); for (const c of list) ROW_OF.set(c.code, i); };
  for (const f of FACES) {
    for (const lv of [4, 3, 2, 1]) {
      const list = [];
      for (const col of f.cols) for (const [l, b] of col.slots) if (l === lv) list.push({ code: `${f.id}-${String(col.c).padStart(2, "0")}-L${l}-B${b}`, x: col.x0 + b - 1 });
      list.sort((a, b) => a.x - b.x);
      if (list.length) push(f.id + "-L" + lv, list, f.id);
    }
    const base = f.id + "-FLOOR", n = floorCount(base);
    push(base, Array.from({ length: n }, (_, i) => ({ code: fcode(base, i + 1), x: i * 1.6 })), f.id);
  }
  for (const a of AREAS) { const n = floorCount(a.id); push(a.id, Array.from({ length: n }, (_, i) => ({ code: fcode(a.id, i + 1), x: i * 1.6 })), "areas"); }
}
function nextCode(code, dir) {
  const r = ROW_OF.get(code); if (r == null) return null;
  const row = ROWS[r].cells, i = row.findIndex(c => c.code === code), x = row[i].x;
  if (dir === "left") return i > 0 ? row[i - 1].code : null;
  if (dir === "right") return i < row.length - 1 ? row[i + 1].code : null;
  if (dir === "home") return row[0].code;
  if (dir === "end") return row[row.length - 1].code;
  const rr = ROWS[r + (dir === "up" ? -1 : 1)];
  return rr ? rr.cells.reduce((best, c) => Math.abs(c.x - x) < Math.abs(best.x - x) ? c : best, rr.cells[0]).code : null;
}
function move(dir, extend) {
  const next = nextCode(st.sel, dir); if (!next) return;
  if (extend) {
    if (!st.anchor) st.anchor = st.sel;
    if (ROWS[ROW_OF.get(next)].group !== ROWS[ROW_OF.get(st.anchor)].group) return; // a selection stays on one rack side
  } else st.anchor = null;
  select(next); updateRange();
}
/* Range selection: a rectangle between the anchor and the selected cell, on one rack side */
let RANGE = new Set();
const xOf = code => { const r = ROW_OF.get(code); const c = r == null ? null : ROWS[r].cells.find(c => c.code === code); return c ? c.x : 0; };
const orderCodes = codes => codes.slice().sort((a, b) => ROW_OF.get(a) - ROW_OF.get(b) || xOf(a) - xOf(b));

    for (const i of items) if (i.loc) { const v = ch.get(i.loc) || { lines: [] }; v.lines.push({ k: i.k, q: i.q }); ch.set(i.loc, v); }
  } else if (items.length === 1) {
    for (const code of selection()) ch.set(code, { lines: [{ k: items[0].k, q: items[0].q }] });
  } else {
    let targets = selection();
    if (targets.length < items.length) {
      targets = [st.sel]; const dir = st.after === "stay" ? "right" : st.after;
      while (targets.length < items.length) { const n = nextCode(targets.at(-1), dir); if (!n) break; targets.push(n); }
    }
    items.slice(0, targets.length).forEach((i, n) => ch.set(targets[n], { lines: [{ k: i.k, q: i.q }] }));
  }
  applyChanges([...ch].map(([code, val]) => ({ code, val })));
  const guessed = items.some(i => i.guessed) ? " Rows with no case count got a full pallet." : "";
  toast(`Pasted ${ch.size} cell${ch.size === 1 ? "" : "s"} from the clipboard.${guessed}`);
}

$("grid").addEventListener("keydown", e => {
  if (st.mode !== "grid") return;
  const k = e.key;
  const dirs = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", Home: "home", End: "end" };
  if (dirs[k]) { e.preventDefault(); move(dirs[k], e.shiftKey); return; }
  if (k === "PageDown" || k === "PageUp") { e.preventDefault(); jumpFace(k === "PageDown" ? 1 : -1); return; }
  const mod = e.ctrlKey || e.metaKey;
  // e.code names the physical key (Option+A types "å" on a Mac); fall back to e.key where code is missing
  const is = L => e.code === "Key" + L || k.toLowerCase() === L.toLowerCase();
  if (mod && is("Z")) { e.preventDefault(); doUndo(); return; }
  if (mod && is("C")) { copySel(false); return; }
  if (mod && is("X")) { copySel(true); return; }
  if (mod && is("V")) { armPaste(); return; }
  if (e.altKey && !mod && (is("A") || k === "å")) { e.preventDefault(); fillColumn(); return; }
  if (mod || e.altKey) return;
  if (k === "Escape") { if (RANGE.size) clearRange(); else if (!$("help").hidden) toggleHelp(false); return; }
  if (k === "?") { e.preventDefault(); toggleHelp(); return; }
  if (k === "Enter" || k === "F2") { e.preventDefault(); beginEdit("", true); return; }
  const many = RANGE.size > 1, sel = selection();
  if (k === "Delete" || k === "Backspace") {
    e.preventDefault(); const had = sel.filter(c => cells.has(c));
    if (had.length) { applyChanges(had.map(code => ({ code, val: null }))); toast(`Cleared ${had.length > 1 ? had.length + " cells" : had[0]}. ${MOD}+Z to undo.`); }
    return;
  }
  if (k === "=") {
    e.preventDefault(); if (!st.lastLines) { toast("Nothing entered yet to repeat."); return; }
    applyChanges(sel.map(code => ({ code, val: { lines: clone(st.lastLines) } })));
    if (!many && st.after !== "stay") move(st.after); return;
  }
  if (k === "-") {
    e.preventDefault(); applyChanges(sel.map(code => ({ code, val: { lines: [], empty: true } })));
    if (!many && st.after !== "stay") move(st.after); return;
  }
  if (k.length === 1 && k !== " ") { e.preventDefault(); clearRange(); beginEdit(k, false); }
});

/* ---------- Storage: shared database, with this-device fallback ---------- */
const today = new Date();
const ymd = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, "0")}${String(today.getDate()).padStart(2, "0")}`;
const defaultSession = { id: "count-" + ymd, name: "Count " + today.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }), created: today.toISOString() };
const store = {
  db: null, sid: null, sessions: new Map(), unsubs: [], inflight: new Map(), pending: new Map(), mode: "starting",
  status(msg, warn) { const el = $("saveStatus"); el.textContent = msg; el.classList.toggle("warn", !!warn); },
  async init() {
    let db = null;
    try { db = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db") : null; } catch (_) { db = null; }
    if (!db) { this.mode = "local"; this.status("Saving on this device only", true); this.loadLocalSessions(); return; }
    this.db = db; this.mode = "db"; this.status("Saved");
    let first = true;
    db.collection("sessions").onSnapshot(snap => {
      this.sessions.clear();
      for (const d of snap.docs) this.sessions.set(d.id, { id: d.id, ...d.data() });
      if (first) { first = false; const want = LS.get("ic.session", null); const pick = (want && this.sessions.has(want)) ? want : ([...this.sessions.values()].sort((a, b) => String(b.created).localeCompare(String(a.created)))[0] || defaultSession).id; this.open(pick); }
      renderSessions();
    }, err => { this.status("Couldn't reach saved counts (" + err.code + ")", true); });
  },
  loadLocalSessions() {
    for (const s of LS.get("ic.sessions", [])) this.sessions.set(s.id, s);
    const want = LS.get("ic.session", null);
    this.open(want && this.sessions.has(want) ? want : ([...this.sessions.values()].pop() || defaultSession).id);
    renderSessions();
  },
  open(sid) {
    for (const u of this.unsubs) u(); this.unsubs = [];
    this.sid = sid; LS.set("ic.session", sid);
    cells.clear(); undo.length = 0;
    if (this.mode === "local") {
      for (const [code, v] of Object.entries(LS.get("ic.cells." + sid, {}))) cells.set(code, v);
      renderAll(); select(st.sel, { noScroll: true }); renderSessions(); return;
    }
    renderAll(); select(st.sel, { noScroll: true });
    const groups = [...new Set([...RACKS.map(r => "r-" + r), "areas"])];
    for (const g of groups) {
      const un = this.db.collection(`sessions/${sid}/${g}`).onSnapshot(snap => {
        if (this.sid !== sid) return;
        for (const ch of snap.docChanges()) {
          const code = ch.doc.id;
          if (this.pending.has(code) || this.inflight.get(code)) continue;
          if (ch.type === "removed") cells.delete(code); else cells.set(code, ch.doc.data());
          afterChange(code);
        }
        if (st.draft == null) renderEntry();
      }, err => this.status("Live updates stopped (" + err.code + "). Reload to reconnect.", true));
      this.unsubs.push(un);
    }
  },
  async ensureSession() {
    if (this.sessions.has(this.sid)) return;
    const s = this.sid === defaultSession.id ? defaultSession : { id: this.sid, name: this.sid, created: new Date().toISOString() };
    this.sessions.set(s.id, s);
    if (this.mode === "local") { LS.set("ic.sessions", [...this.sessions.values()]); renderSessions(); return; }
    await this.db.doc("sessions/" + s.id).set({ name: s.name, created: s.created });
  },
  write(code, val) {
    if (this.mode === "local") {
      this.ensureSession();
      const all = LS.get("ic.cells." + this.sid, {}); if (val) all[code] = val; else delete all[code]; LS.set("ic.cells." + this.sid, all); return;
    }
    if (this.mode !== "db") return;
    this.pending.set(code, { val, sid: this.sid });
    if (!this.inflight.get(code)) this.flush(code);
  },
  async flush(code) {
    this.inflight.set(code, true);
    try {
      while (this.pending.has(code)) {
        const { val, sid } = this.pending.get(code); this.pending.delete(code);
        this.status("Saving…");
        await this.ensureSession();
        const ref = this.db.doc(`sessions/${sid}/${groupOf(code)}/${code}`);
        let tries = 0;
        for (;;) {
          try { if (val) await ref.set({ ...val, at: new Date().toISOString() }); else await ref.delete(); break; }
          catch (err) {
            if (err && err.code === "unavailable" && tries++ < 2) { await new Promise(r => setTimeout(r, 400 + Math.random() * 800)); continue; }
            throw err;
          }
        }
      }
      const busy = [...this.inflight].some(([c, v]) => v && c !== code) || this.pending.size > 0;
      if (!busy) this.status("Saved");
    } catch (err) {
      this.status(err && err.code === "quota_exceeded" ? "Storage is full. Export and start a new count." : "Not saved (" + (err && err.code || "error") + "). Check your connection.", true);
    } finally { this.inflight.set(code, false); }
  },
  async create(name) {
    const s = { id: "count-" + Date.now().toString(36), name, created: new Date().toISOString() };
    this.sessions.set(s.id, s);
    if (this.mode === "db") { try { await this.db.doc("sessions/" + s.id).set({ name: s.name, created: s.created }); } catch (err) { this.status("Couldn't create the count (" + err.code + ")", true); return; } }
    else LS.set("ic.sessions", [...this.sessions.values()]);
    this.open(s.id); renderSessions(); toast(`Started “${name}”.`);
  },
};
function renderSessions() {
  const list = [...store.sessions.values()];
  if (store.sid && !store.sessions.has(store.sid)) list.push(store.sid === defaultSession.id ? defaultSession : { id: store.sid, name: store.sid });
  list.sort((a, b) => String(b.created || "").localeCompare(String(a.created || "")));
  $("session").innerHTML = list.map(s => `<option value="${esc(s.id)}" ${s.id === store.sid ? "selected" : ""}>${esc(s.name || s.id)}</option>`).join("");
}

const createNew = () => { const n = $("newName").value.trim(); if (!n) { $("newName").focus(); return; } $("newForm").hidden = true; $("newBtn").hidden = false; $("newName").value = ""; store.create(n); };

/* ---------- Export: .xlsx in the stock workbook's layout ---------- */
/*XLSX-START*/
// Same tabs, columns, header style and row order as the DECCAN/MATCO stock workbooks, so the
// RACK tab's QUERY formula (which reads Anaganaga, NearCooler, DOOR6, Rack00, RACK02… by name) still works.
function buildWorkbook(ExcelJS, ctx) {
  const { faces, cells, products } = ctx;
  const wb = new ExcelJS.Workbook();
  wb.creator = "Warehouse Count";
  const HDR = ["Location", "Item", "No. of Cases", "Best Before Date", "Batch No", "Container"];
  const WIDTHS = [11.6, 53, 6.4, 12.3, 19, 21.7, 5, 11.6, 53, 6.4, 12.3, 19.3, 14.3, 5, 11.6, 53, 6.4, 12.3, 19.3, 14.3];
  const thin = { style: "thin" }, border = { top: thin, left: thin, bottom: thin, right: thin };
  const font = { name: "Calibri", size: 11 };
  const pad = n => String(n).padStart(2, "0");
  const linesOf = code => { const v = cells.get(code); return v && v.lines && v.lines.length ? v.lines : []; };
  const pallets = prefix => [...cells.keys()].filter(c => c.startsWith(prefix + "-P") && linesOf(c).length).sort();

  // blocks = how many rack sides sit side by side (A in A–F, B in H–M, C in O–T)
  function sheet(name, header, blocks, widths) {
    const ws = wb.addWorksheet(name);
    const row1 = Array.from({ length: blocks }, (_, i) => i ? [null, ...header] : header).flat();
    ws.columns = (widths || WIDTHS).slice(0, row1.length).map(w => ({ width: w }));
    const r = ws.getRow(1);
    row1.forEach((v, i) => {
      if (v == null) return;
      const c = r.getCell(i + 1);
      c.value = v; c.font = { ...font, bold: true }; c.border = border;
      c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFB7B7B7" } };
      c.alignment = { horizontal: "center", vertical: "middle" };
    });
    return ws;
  }
  function put(ws, rowNo, offset, loc, line, dateCols) {
    const row = ws.getRow(rowNo);
    for (let i = 1; i <= 6; i++) { const c = row.getCell(offset + i); c.border = border; c.font = font; }
    row.getCell(offset + 1).value = loc;
    if (line) { row.getCell(offset + 2).value = line.k; row.getCell(offset + 3).value = +line.q; }
    row.getCell(offset + 3).alignment = { horizontal: "center" };
    if (dateCols !== false) { row.getCell(offset + 4).numFmt = "mmm yyyy"; row.getCell(offset + 4).alignment = { horizontal: "center" }; row.getCell(offset + 6).numFmt = "0"; }
  }
  // Lay out each side's list in its own block, row by row; a mixed pallet repeats its location on extra rows.
  function writePairs(ws, start, lists, dateCols) {
    let r = start;
    const n = Math.max(0, ...lists.map(l => l.length));
    for (let i = 0; i < n; i++) {
      const hs = lists.map(l => l[i] ? Math.max(1, l[i].lines.length) : 0);
      for (let j = 0; j < Math.max(...hs); j++) {
        lists.forEach((l, s) => { if (j < hs[s]) put(ws, r, s * 7, l[i].loc, l[i].lines[j] || null, dateCols); });
        r++;
      }
    }
    return r;
  }
  const slotList = (face, c) => {
    const col = face && face.cols.find(x => x.c === c);
    if (!col) return [];
    return col.slots.slice().sort((x, y) => x[1] - y[1] || x[0] - y[0])
      .map(([l, b]) => { const code = `${face.id}-${pad(c)}-L${l}-B${b}`; return { loc: code, lines: linesOf(code) }; });
  };
  const floorList = (prefix, label) => pallets(prefix).map(code => ({ loc: label, lines: linesOf(code) }));

  // RACK: every counted line, sorted by item then location (what the old QUERY produced)
  const all = [];
  const labelOf = code => {
    let m = code.match(/^(D?\d+[A-Z])-FLOOR-P\d+$/); if (m) return m[1] + " Floor";
    for (const [id, label] of ctx.areaLabels) if (code.startsWith(id + "-P")) return label;
    return code;
  };
  for (const [code, v] of cells) for (const l of (v.lines || [])) all.push([labelOf(code), l.k, +l.q]);
  all.sort((a, b) => a[1].localeCompare(b[1]) || a[0].localeCompare(b[0], undefined, { numeric: true }));
  const rack = sheet("RACK", ["LOCATION", "ITEM", "# CASES", "BBD", "BATCH NO", "CONTAINER"], 1);
  all.forEach((x, i) => put(rack, i + 2, 0, x[0], { k: x[1], q: x[2] }));

  // TOTALS: cases and pallets per product
  const tot = new Map();
  for (const v of cells.values()) for (const l of (v.lines || [])) { const x = tot.get(l.k) || { q: 0, n: 0 }; x.q += +l.q || 0; x.n++; tot.set(l.k, x); }
  const tw = sheet("TOTALS", ["Product Code", "Product", "Product Desc", "Total Cases", "Pallets"], 1, [12, 53, 45, 12, 9]);
  [...tot].sort((a, b) => ((products.get(a[0]) || {}).c || a[0]).localeCompare((products.get(b[0]) || {}).c || b[0], undefined, { numeric: true }))
    .forEach(([k, x], i) => {
      const p = products.get(k) || { c: "", n: "" }, row = tw.getRow(i + 2);
      [p.c, k, p.n, x.q, x.n].forEach((v, j) => { const c = row.getCell(j + 1); c.value = v; c.border = border; c.font = font; });
      row.getCell(4).alignment = row.getCell(5).alignment = { horizontal: "center" };
    });

  // Floor areas, each in the tab the old workbook used
  const area = (name, header, blocks, prefixes, dateCols) => {
    const ws = sheet(name, header, blocks);
    let r = 2;
    for (const [prefix, label] of prefixes) r = writePairs(ws, r, [floorList(prefix, label)], dateCols);
  };
  area("Anaganaga", [...HDR, "Description"], 1, [["LINE-2-3", "Between line 2 & 3"]]);
  area("NearCooler", HDR, 1, [1, 2, 3, 4, 5].map(n => ["NEARCOOLER-0" + n, "NEARCOOLER-0" + n]));

  // Racks: one tab per rack, column by column, a blank row after each column, then floor pallets
  const racks = [...new Set(faces.map(f => f.rack))];
  const rackTab = r => r === "0" ? "Rack00" : r.startsWith("D") ? "DOOR" + r.slice(1) : "RACK" + pad(r);
  const doorFirst = racks.filter(r => r.startsWith("D")), numbered = racks.filter(r => !r.startsWith("D"));
  const writeRack = r => {
    const sides = faces.filter(f => f.rack === r).sort((x, y) => x.side.localeCompare(y.side));
    const ws = sheet(rackTab(r), HDR, sides.length);
    const cols = [...new Set(sides.flatMap(f => f.cols.map(c => c.c)))].sort((x, y) => x - y);
    let row = 2;
    for (const c of cols) { row = writePairs(ws, row, sides.map(f => slotList(f, c))); row++; }
    row = writePairs(ws, row, sides.map(f => floorList(f.id + "-FLOOR", f.id + " Floor")));
    if (r === "7") writePairs(ws, row, [floorList("LANE-7", "Lane 7")]);
  };
  doorFirst.forEach(writeRack);
  area("DOOR2N3", HDR, 2, [["DOOR-2-3", "DOOR 2N3"]]);
  area("Front", HDR, false, [["LOAD-AREA", "LOAD_AREA_01"]]);
  area("CSFloor", ["Location", "Item", "QTY", "Container", "WH Arrival Date", "Batch No"], 2, [["RECV-FLOOR", "Recv Floor"]], false);
  numbered.forEach(writeRack);
  return wb;
}
/*XLSX-END*/

function loadExcelJS() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  const urls = ["https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js", "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"];
  return new Promise((resolve, reject) => {
    const next = () => {
      const u = urls.shift(); if (!u) { reject(new Error("load")); return; }
      const s = document.createElement("script"); s.src = u;
      s.onload = () => (window.ExcelJS ? resolve(window.ExcelJS) : next()); s.onerror = next;
      document.head.appendChild(s);
    };
    next();
  });
}
async function exportXlsx() {
  let hasAny = false; for (const v of cells.values()) if (v.lines && v.lines.length) { hasAny = true; break; }
  if (!hasAny) { toast("Nothing counted yet in this count."); return; }
  const btn = $("expXlsx"); btn.disabled = true; const label = btn.textContent; btn.textContent = "Building…";
  try {
    let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (_) {}
    if (!dl) { toast("Downloads aren't available in this view. Open the page in claude.ai to export."); return; }
    let ExcelJS; try { ExcelJS = await loadExcelJS(); } catch (_) { toast("Couldn't load the Excel builder. Check your connection and try again."); return; }
    const wb = buildWorkbook(ExcelJS, { faces: FACES, cells, products: P, areaLabels: AREA_LABELS });
    const buf = await wb.xlsx.writeBuffer();
    const d = new Date(), stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
    const filename = `WAREHOUSE_STOCK_${stamp}.xlsx`;
    try { await dl.save({ filename, data: new Blob([buf]) }); toast(`Saved ${filename}.`); }
    catch (err) {
      if (err && err.code === "declined") return;
      toast(err && err.code === "rate_limited" ? "A save is already open. Try again in a moment." : "The download didn't go through (" + (err && err.code || "error") + ").");
    }
  } finally { btn.disabled = false; btn.textContent = label; }
}
const AREA_LABELS = [["LINE-2-3", "Between line 2 & 3"], ["LANE-7", "Lane 7"], ["DOOR-2-3", "DOOR 2N3"], ["LOAD-AREA", "LOAD_AREA_01"], ["RECV-FLOOR", "Recv Floor"],
  ...[1, 2, 3, 4, 5].map(n => ["NEARCOOLER-0" + n, "NEARCOOLER-0" + n])];
$("expXlsx").addEventListener("click", exportXlsx);
